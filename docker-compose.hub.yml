# AIHOT 部署配置 —— 从 Docker Hub 拉取镜像，数据绑定挂载到本目录
#
# 与官方 docker-compose.yml 的区别：
#   1. x-app 去掉 build，改用 ${AIHOT_IMAGE} 从 Docker Hub 拉取
#   2. 数据用绑定挂载（./db、./data）而不是命名卷，全部落在本文件所在目录
#   3. 新增 prepare / prepare-db 两个一次性容器，自动建目录并修属主
#
# 好处：NAS 不用装 Node、不用 clone 源码、不用编译；升级只需 pull + up；
#       重装只需 up -d，目录和权限由 prepare 容器自动搞定。
#
# 使用前提：
#   1. .env 里已设 AIHOT_IMAGE=你的用户名/aihot-app:latest
#   2. 同一目录下有 .env 文件
#
# 部署（首次和重装都是这两条）：
#   docker compose -f docker-compose.hub.yml pull
#   docker compose -f docker-compose.hub.yml up -d
#
# 目录说明：
#   ./db     PostgreSQL 数据，prepare-db 容器自动设为 uid 999
#   ./data   上传图片与缓存，prepare 容器自动设为 uid 1000（node）
#   ./caddy  证书，仅启用 https profile 时用到
#
# 群晖 HTTPS：不要用下面的 caddy profile（占 80/443，会撞 DSM 的 Web Station）。
#   改用「控制面板 → 登录门户 → 高级 → 反向代理」转发到 http://127.0.0.1:3100，
#   并在 .env 里设 PORT=127.0.0.1:3100、TRUST_PROXY=true、SITE_URL=https://你的域名。
name: aihot

x-app: &app
  image: ${AIHOT_IMAGE:?请在 .env 里设置 AIHOT_IMAGE=你的用户名/aihot-app:latest}
  restart: unless-stopped

x-backend: &backend
  <<: *app
  env_file: .env
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD:-aihot}@db:5432/aihot
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    LOCAL_ROUTER_URL: http://web:3000
    INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-10}
  volumes:
    - ./data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  # 一次性容器：把 ./data 交给容器内的 node 用户（uid 1000）。
  # 绑定挂载的目录默认属主是 root，不修的话 api/worker/web 会因 permission denied 起不来。
  prepare:
    image: ${AIHOT_IMAGE:?请在 .env 里设置 AIHOT_IMAGE}
    user: "0"
    restart: "no"
    volumes:
      - ./data:/data
    command: ["sh", "-c", "mkdir -p /data/uploads && chown -R node:node /data"]
    network_mode: none

  # 一次性容器：把 ./db 交给容器内的 postgres 用户（uid 999）。
  # 用官方 postgres 镜像来 chown，按镜像里的真实用户设，不用记数字。
  prepare-db:
    image: postgres:17-alpine
    user: "0"
    restart: "no"
    volumes:
      - ./db:/var/lib/postgresql/data
    command: ["sh", "-c", "chown -R postgres:postgres /var/lib/postgresql/data"]
    network_mode: none

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aihot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihot}
      POSTGRES_DB: aihot
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihot -d aihot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 跑数据库迁移和种子数据，然后退出。迁移脚本已打进镜像，拉镜像即可运行。
  setup:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]
    depends_on:
      prepare:
        condition: service_completed_successfully
      prepare-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["node", "apps/worker/src/main.ts"]
    # 停止时留 210 秒让进行中的付费调用收尾，否则会变成「结果不明」并重复计费
    stop_grace_period: 210s
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["node", "apps/web/server.ts"]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AIHOT_RELEASE: ${AIHOT_RELEASE:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

  # 仅在用 Caddy 做 HTTPS 时启用（群晖上一般不用，改用 DSM 自带反向代理）
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/data
    depends_on:
      - web
